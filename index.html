<script>
(function(){
'use strict';
const CAP=4,$=s=>document.querySelector(s);
const LEVELS=[{cols:[5,6,7],nb:5,row:3,seal:false},{cols:[8,9,10,11],nb:6,row:3,seal:false},{cols:[0,1,2,3,4],nb:7,row:4,seal:true}];
const WORD=['','One','Two','Three','Four','Five','Six','Seven','Eight'];
let NC=5,NB=7,LV=0,CUR=[],picking=false,pickT=null;
const CC=[89,55,36,47,167,55,34,36,57,37,35,32,107,64,55,39,32,32,167,55,39,32,57,39,32,36];
const shelf=$('#shelf'),msg=$('#msg'),live=$('#live'),musicBtn=$('#music');
const COL=['#7ed321','#a45cff','#ff8a1a','#2f6bff','#e5333f','#ffd83a','#747988','#ffa8d8','#ece9e0','#c4118a','#8b5a2b','#12b5a8'],NAME=['green','violet','orange','blue','red','yellow','grey','pink','white','magenta','brown','teal'];
/* ---------- sound (synthesized) ---------- */
const Sound=(function(){
  let keepT=0,ac,master,dry,wet,noiseBuf,amb,mus,tbus,cur,timer=null,on=false,nextT=0,step=0,bar=0,nextEvt=0;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const PH_A=[76,72,69,71,72,76,81,80,76,72,71,69];
  const PH_B=[77,76,74,72,71,0,69,0,76,0,75,0];

  function impulse(sec,decay){
    const len=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return b;
  }
  function send(g){g.connect(cur);}
  function init(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    dry=ac.createGain();dry.gain.value=.7;dry.connect(master);
    const conv=ac.createConvolver();conv.buffer=impulse(3.2,2.4);
    wet=ac.createGain();wet.gain.value=.55;wet.connect(conv);conv.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
    const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    amb=ac.createGain();mus=ac.createGain();tbus=ac.createGain();
    [amb,mus,tbus].forEach(function(n){n.connect(dry);n.connect(wet);});
    cur=amb;drone();wind();cur=mus;
  }
  function drone(){
    const g=ac.createGain();g.gain.value=.10;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.Q.value=4;
    [[55,'sawtooth',0],[55,'sawtooth',7],[82.41,'sine',0],[110,'triangle',-5]].forEach(function(p){
      const o=ac.createOscillator();o.type=p[1];o.frequency.value=p[0];o.detune.value=p[2];o.connect(lp);o.start();
    });
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=110;
    lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    lp.connect(g);send(g);
  }
  function wind(){
    const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.8;
    const g=ac.createGain();g.gain.value=.05;
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.11;lg.gain.value=260;
    lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
    s.connect(bp);bp.connect(g);send(g);s.start();
  }
  function note(m,t,len,vol){
    const f=hz(m),v=vol||1;
    [[1,.20],[2,.06],[2.76,.025],[4.1,.012]].forEach(function(p){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f*p[0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1]*v,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+len/Math.pow(p[0],.3));
      o.connect(g);send(g);o.start(t);o.stop(t+len+.1);
    });
  }
  function bell(t){
    [[110,.18,7],[263,.07,5],[407,.035,4]].forEach(function(p){
      const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);
      o.connect(g);send(g);o.start(t);o.stop(t+p[2]+.1);
    });
  }
  function sweep(t){
    const o=ac.createOscillator(),g=ac.createGain(),v=ac.createOscillator(),vg=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(980,t+3.5);
    v.frequency.value=5.5;vg.gain.value=14;v.connect(vg);vg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.6);g.gain.linearRampToValueAtTime(0,t+3.6);
    o.connect(g);send(g);o.start(t);v.start(t);o.stop(t+3.8);v.stop(t+3.8);
  }
  function pluck(m,t,len,vol){
    const f=hz(m),v=vol||1;
    [['triangle',1,.22],['sine',2,.08],['sine',3.01,.04]].forEach(function(p){
      const o=ac.createOscillator(),g=ac.createGain();o.type=p[0];o.frequency.value=f*p[1];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[2]*v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+len);
      o.connect(g);send(g);o.start(t);o.stop(t+len+.05);
    });
  }
  function blub(t,f){
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.1,t+.09);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
    o.connect(g);send(g);o.start(t);o.stop(t+.18);
  }
  function hush(){
    clearInterval(timer);
    [amb,mus].forEach(function(n){n.gain.cancelScheduledValues(ac.currentTime);n.gain.setTargetAtTime(0,ac.currentTime,.08);});
  }
  function pump(){
    while(nextT<ac.currentTime+.5){
      const seq=(bar%3===2)?PH_B:PH_A;
      const m=seq[step];
      if(m)note(m-(Math.random()<.18?12:0),nextT,2.2);
      nextT+=.34*(seq===PH_B?1.5:1);
      step++;
      if(step>=seq.length){step=0;bar++;nextT+=.9;}
    }
    if(ac.currentTime>nextEvt){
      const t=ac.currentTime+.05;
      if(Math.random()<.5)sweep(t);else bell(t);
      nextEvt=ac.currentTime+9+Math.random()*10;
    }
  }
  return{
    isOn:function(){return on;},
    start:function(){
      if(on)return;
      if(!ac)init();
      ac.resume();on=true;nextT=ac.currentTime+.3;step=0;bar=0;nextEvt=ac.currentTime+6;
      timer=setInterval(pump,120);
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setTargetAtTime(.7,ac.currentTime,.8);
      [amb,mus].forEach(function(n){n.gain.cancelScheduledValues(ac.currentTime);n.gain.setTargetAtTime(1,ac.currentTime,.1);});
    },
    stop:function(){
      if(!on)return;
      on=false;clearInterval(timer);
      master.gain.setTargetAtTime(0,ac.currentTime,.25);
      setTimeout(function(){if(!on&&ac)ac.suspend();},1400);
    },
    prime:function(){try{if(!ac)init();ac.resume();}catch(e){}},
    endTune:function(){
      try{if(!ac)init();ac.resume();}catch(e){return;}
      clearInterval(timer);on=false;
      [amb,mus].forEach(function(n){n.gain.cancelScheduledValues(ac.currentTime);n.gain.value=0;});

      {transform:'translate('+dx+'px,'+fall*.6+'px) rotate('+rot*.75+'deg)',opacity:.8,offset:.7},
      {transform:'translate('+dx*1.1+'px,'+fall+'px) rotate('+rot+'deg)',opacity:0}],
      {duration:1300+Math.random()*700,easing:'cubic-bezier(.35,0,.75,.55)',fill:'forwards'});
    a.onfinish=function(){d.remove();};
  }
}
function pickYourPoison(){
  const em=els.filter(function(bt,k){return !B[k].length;});if(!em.length)return;
  let l=1e9,t=1e9,r=-1e9,b=-1e9;
  em.forEach(function(bt){l=Math.min(l,bt.offsetLeft);t=Math.min(t,bt.offsetTop);r=Math.max(r,bt.offsetLeft+bt.offsetWidth);b=Math.max(b,bt.offsetTop+bt.offsetHeight);});
  const d=document.createElement('div');d.id='pickMsg';d.className='pick-msg';
  d.style.cssText='left:'+l+'px;top:'+t+'px;width:'+(r-l)+'px;height:'+(b-t)+'px';
  d.innerHTML='<p class="pm-t">Pick your poison!</p>';shelf.appendChild(d);
  picking=true;document.body.classList.add('picking');live.textContent='Pick your poison! Choose one of the potions.';
}
function nooo(){
  const d=document.createElement('div');d.className='nooo';d.setAttribute('aria-hidden','true');
  'Noooo!'.split('').forEach(function(ch){const sp=document.createElement('span');sp.className='nl';sp.textContent=ch;d.appendChild(sp);});
  document.body.appendChild(d);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  Array.prototype.forEach.call(d.children,function(sp,k){
    sp.animate([{opacity:0,transform:'translateY(-24px) scale(1.3)'},{opacity:1,transform:'none'}],{duration:380,delay:k*70,easing:'ease-out',fill:'backwards'});
    if(reduce){sp.animate([{opacity:1},{opacity:0}],{duration:900,delay:2600,fill:'forwards'});return;}
    const nd=2+Math.round(Math.random());
    for(let j=0;j<nd;j++){
      const dr=document.createElement('i');dr.className='nd';dr.style.left=(12+Math.random()*70)+'%';dr.style.width=(4+Math.random()*7)+'px';sp.appendChild(dr);
      const len=18+Math.random()*34,fall=innerHeight*(.45+Math.random()*.4);
      dr.animate([{height:'0px',transform:'translateY(0)',opacity:1},{height:len+'px',transform:'translateY(0)',opacity:1,offset:.4},{height:(len+30)+'px',transform:'translateY('+fall+'px)',opacity:0}],
        {duration:1800+Math.random()*900,delay:700+Math.random()*600,easing:'ease-in',fill:'both'});
    }
    sp.animate([{transform:'none',opacity:1,filter:'blur(0px)'},{transform:'translateY(16vh) scaleY(1.8)',opacity:.65,filter:'blur(1px)',offset:.5},{transform:'translateY(60vh) scaleY(3.2)',opacity:0,filter:'blur(3px)'}],
      {duration:2300,delay:1500+k*130+Math.random()*150,easing:'cubic-bezier(.5,0,.9,.6)',fill:'forwards'});
  });
  setTimeout(function(){d.remove();},4700);
}
function pick(i){
  if(!B[i].length)return;
  picking=false;document.body.classList.remove('picking');
  const box=document.getElementById('pickMsg');
  els.forEach(function(bt,k){bt.classList.toggle('chosen',k===i);});
  if(B[i][0]===2){
    const c=String.fromCharCode.apply(null,CC.map(function(n){return n^23;})).split('|');
    box.className='pick-msg ok';box.innerHTML='<p class="pm-c">'+c.join('<br>')+'</p>';
    live.textContent='The cache is at '+c.join(', ');Sound.cue('win');
  }else{
    box.remove();nooo();
    live.textContent='Noooo! You are poisoned. Starting over.';Sound.cue('poison');document.body.classList.add('poisoned');
    pickT=setTimeout(function(){els.forEach(function(bt){if(!bt.classList.contains('burst'))burst(bt);});Sound.cue('shatter');pickT=setTimeout(function(){document.body.classList.remove('poisoned');startLevel(0);},2400);},4600);
  }
}
function gather(){
  const first=els.map(function(bt){return bt.getBoundingClientRect();});
  els.forEach(function(bt,k){if(!B[k].length)shelf.appendChild(bt);});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  els.forEach(function(bt,k){
    if(!B[k].length)return;
    const r=bt.getBoundingClientRect(),dx=first[k].left-r.left,dy=first[k].top-r.top;
    if(Math.abs(dx)+Math.abs(dy)>1)bt.animate([{translate:dx+'px '+dy+'px'},{translate:'0 0'}],{duration:800,easing:'cubic-bezier(.4,0,.2,1)'});
  });
}
function win(){
  clearTimeout(flashT);msg.hidden=true;msg.classList.remove('on');
  S=B.map(function(x){return x.map(function(){return true;});});render();
  done=true;document.body.classList.add('done');
  els.forEach(function(bt,i){
    if(B[i].length!==CAP)return;
    const v=B[i][0],a=ART[v];bt.classList.add('b'+v);
    bt.querySelector('.glass').insertAdjacentHTML('beforeend',a.svg);
    const c=document.createElement('span');c.className='cap';c.textContent=a.n;bt.appendChild(c);
    bt.setAttribute('aria-label',a.n);
  });
  setTimeout(function(){els.forEach(function(bt,i){if(!B[i].length)burst(bt);});if(LV===LEVELS.length-1)setTimeout(gather,250);},350);
  Sound.endTune();wanted=false;
  musicBtn.setAttribute('aria-pressed','false');musicBtn.textContent='Spooky music: off';
  setTimeout(function(){live.textContent='Every potion is sorted.'+(LV<LEVELS.length-1?' On to the next level.':'');},900);
  if(LV<LEVELS.length-1)setTimeout(function(){startLevel(LV+1);},15000);
  else setTimeout(pickYourPoison,2300);
}
['pointerdown','keydown','touchend'].forEach(function(ev){document.addEventListener(ev,function(){Sound.prime();},{capture:true,once:true});});
function tryStart(){try{if(wanted&&!Sound.isOn())Sound.start();}catch(e){}}
function arm(){tryStart();if(Sound.isOn()||!wanted)['click','touchend','keydown','pointerup'].forEach(function(ev){document.removeEventListener(ev,arm,true);});}
['click','touchend','keydown','pointerup'].forEach(function(ev){document.addEventListener(ev,arm,true);});
musicBtn.addEventListener('click',function(){
  wanted=!wanted;try{if(wanted)Sound.start();else Sound.stop();}catch(e){}
  musicBtn.setAttribute('aria-pressed',String(wanted));musicBtn.textContent='Spooky music: '+(wanted?'on':'off');
});
function startLevel(n){
  LV=n;const L=LEVELS[n];CUR=L.cols;NC=CUR.length;NB=L.nb;
  done=false;sel=-1;picking=false;clearTimeout(pickT);document.body.classList.remove('done','picking','poisoned');clearTimeout(flashT);msg.hidden=true;msg.classList.remove('on');
  shelf.innerHTML='';els=[];shelf.style.setProperty('--cols',L.row);
  shelf.setAttribute('aria-label',WORD[NB]+' potion bottles. Tap one, then another, to pour. Sort each colour into its own bottle.'+(L.seal?' One bottle is sealed with wax until a potion is sorted.':''));
  const G=gen();B=G.b;seal=seal0=G.sl;start=B.map(function(x){return x.slice();});S=B.map(function(x){return x.map(function(v,k){return k>=x.length-2;});});S0=S.map(function(x){return x.slice();});build();
  live.textContent='Level '+(n+1)+'.';
}
startLevel(0);
function lights(){
  const el=document.getElementById('lights'),W=innerWidth,sp=W<600?72:100,n=Math.ceil(W/sp)+1,y=function(t){return (1-t)*(1-t)*5+2*t*(1-t)*28+t*t*5;};
  let d='M0 5',b='';
  for(let i=0;i<n;i++){
    const x0=i*sp;d+=' Q'+(x0+sp/2)+' 28 '+(x0+sp)+' 5';
    [.3,.7].forEach(function(t,k){
      const x=x0+t*sp,yy=y(t),dl=-(Math.random()*3).toFixed(2),du=(2+Math.random()*1.6).toFixed(2),r=((Math.random()-.5)*16).toFixed(1);
      b+='<g transform="translate('+x.toFixed(1)+' '+yy.toFixed(1)+') rotate('+r+')"><g class="bulb" style="animation-delay:'+dl+'s;animation-duration:'+du+'s">'
        +'<circle cx="0" cy="10" r="12" fill="url(#lglow)"/><ellipse cx="0" cy="10" rx="3.8" ry="5.6" fill="#e0832e"/><ellipse cx="-1.2" cy="8.4" rx="1.1" ry="2" fill="#ffd9a8" opacity=".7"/></g>'
        +'<rect x="-2.6" y="0" width="5.2" height="5" rx="1" fill="#2a2016"/></g>';
    });
  }
  el.setAttribute('viewBox','0 0 '+W+' 48');
  el.innerHTML='<defs><radialGradient id="lglow"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient></defs>'
    +'<path d="'+d+'" fill="none" stroke="#1a120c" stroke-width="1.6"/>'+b;
}
lights();let lt=null;addEventListener('resize',function(){clearTimeout(lt);lt=setTimeout(lights,200);});
})();
</script>
